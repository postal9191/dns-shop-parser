name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra test
      - run: uv run pytest -q
      - run: uv run python -m compileall -q src

  package-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv build
      - name: Smoke-test the wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import dns_shop_parser"
          "$RUNNER_TEMP/wheel-smoke/bin/dns-parser" --help
          "$RUNNER_TEMP/wheel-smoke/bin/dns-parser-once" --help
          "$RUNNER_TEMP/wheel-smoke/bin/dns-parser-bot" --help
      - name: Audit locked production dependencies
        shell: bash
        run: |
          uv export --locked --no-dev --no-hashes --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" --ignore-vuln PYSEC-2026-2270

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run smoke:qrator
      - run: npx playwright install --dry-run chromium