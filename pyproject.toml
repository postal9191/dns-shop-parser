[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-shop-parser"
version = "1.1.0"
description = "DNS Shop parser with Qrator WAF bypass and Telegram notifications"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Postal" }]
dependencies = [
  "aiohttp==3.13.4",
  "tenacity==8.2.3",
  "python-dotenv==1.2.1",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "tzdata==2025.3",
]

[project.scripts]
dns-parser = "dns_shop_parser.__main__:run_cli"
dns-parser-once = "dns_shop_parser.__main__:parse_cli"
dns-parser-bot = "dns_shop_parser.__main__:bot_cli"
preflight = "dns_shop_parser.__main__:preflight_cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dns_shop_parser*"]

[tool.setuptools.package-data]
dns_shop_parser = ["resources/solve_qrator.js"]
